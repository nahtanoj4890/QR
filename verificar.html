<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Validación</title>
<style>
body{font-family:Arial;margin:40px}
.box{padding:20px;border:1px solid #ccc;border-radius:10px;width:420px}
.ok{color:green;font-weight:bold}
</style>
</head>
<body>

<div class="box">
<h2>Validación de incapacidad</h2>
<div class="ok">CERTIFICADO VALIDO</div>
<br>

Paciente: <span id="paciente"></span><br>
Fecha: <span id="fecha"></span><br>
Días: <span id="dias"></span><br>
Médico: Dr Jonathan Gomez<br>
Registro: <span id="id"></span>

</div>

<script>
const p=new URLSearchParams(window.location.search)
document.getElementById("paciente").textContent=p.get("paciente")
document.getElementById("fecha").textContent=p.get("fecha")
document.getElementById("dias").textContent=p.get("dias")
document.getElementById("id").textContent=p.get("id")
</script>

</body>
</html>
