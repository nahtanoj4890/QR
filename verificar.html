<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Verificación</title>
</head>

<body>

<h2>Validación de incapacidad</h2>

<div id="resultado">Consultando base de datos...</div>

<script>

const API = "AQUI_TU_API"

const params = new URLSearchParams(window.location.search)

const id = params.get("id")

fetch(API + "/search?ID=" + id)

.then(r=>r.json())

.then(data=>{

 if(data.length > 0){

  const c = data[0]

  document.getElementById("resultado").innerHTML =
  "CERTIFICADO VALIDO<br><br>"+
  "Paciente: "+c.PACIENTE+
  "<br>Fecha: "+c.FECHA+
  "<br>Días: "+c.DIAS+
  "<br>Médico: "+c.MEDICO+
  "<br>Registro: "+c.REGISTRO

 }else{

  document.getElementById("resultado").innerHTML =
  "CERTIFICADO NO REGISTRADO"

 }

})

</script>

</body>
</html>
