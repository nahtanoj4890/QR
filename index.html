<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Generar incapacidad</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

</head>

<body>

<h2>Generar incapacidad médica</h2>

<input id="paciente" placeholder="Paciente">

<br><br>

<input id="dias" placeholder="Días">

<br><br>

<button id="btn">Generar incapacidad</button>

<br><br>

<div id="qr"></div>

<h3 id="codigo"></h3>

<script src="./script.js"></script>

<script>

const params = new URLSearchParams(window.location.search)

document.body.innerHTML = `
<h1>Validación de incapacidad</h1>
<h2>CERTIFICADO VALIDO</h2>

Paciente: ${params.get("paciente")} <br>
Fecha: ${params.get("fecha")} <br>
Días: ${params.get("dias")} <br>
Médico: Dr Jonathan Gomez <br>
Registro: ${params.get("id")}
`

</script>

</body>
</html>
